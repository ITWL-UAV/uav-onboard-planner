change-order:
  - time: 0
    text:
      - Obejrzyj dach A, dach B i dach C.
      - Zaplanuj inspekcję w kolejności dach A, dach B, dach C.
    expected: {activity: inspect, target: {sites: [dach A, dach B, dach C]}}
  - time: 4
    text:
      - Zacznij od ostatniego.
      - Przesuń trzeci dach na początek.
    expected: {target: {sites: [dach C, dach A, dach B]}}
  - time: 8
    text:
      - Pomiń dach A.
      - Zrezygnuj z inspekcji dachu A.
    expected: {target: {sites: [dach C, dach B]}}
  - time: 12
    text: Zamień kolejność pozostałych.
    expected: {target: {sites: [dach B, dach C]}}
