name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
          python-version: "3.12"
      - name: Install development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Check types
        run: uv run --no-sync mypy src
      - name: Test
        run: uv run --no-sync pytest
      - name: Build source distribution and wheel
        run: uv build
      - name: Import installed wheel without development dependencies
        run: |
          uv venv /tmp/package-check
          uv pip install --python /tmp/package-check/bin/python dist/*.whl
          cd /tmp
          /tmp/package-check/bin/python -I -c "import uav_onboard_planner"
      - name: Check basic environment
        run: |
          uv sync --locked --no-default-groups --group basic
          uv run --no-sync python -I -c "import uav_onboard_planner"
