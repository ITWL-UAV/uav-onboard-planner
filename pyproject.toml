[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-onboard-planner"
version = "0.1.0"
description = "Onboard software for autonomous UAV mission planning, execution, and in-flight replanning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
nlp = ["pyyaml>=6,<7", "torch>=2.5,<3", "transformers>=5.23,<6"]

[dependency-groups]
basic = []
dev = [
    "jsbsim>=1.2,<2",
    "mypy>=2.4.1",
    "pytest>=8",
    "pyyaml>=6,<7",
    "rotorpy>=3,<4",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real flight dynamics libraries on CPU"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rotorpy.*"]
ignore_missing_imports = true
