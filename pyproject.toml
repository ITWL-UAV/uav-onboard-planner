[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-onboard-planner"
version = "0.1.0"
description = "Onboard software for autonomous UAV mission planning, execution, and in-flight replanning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
basic = []
dev = [
    "jsbsim>=1.2,<2",
    "pytest>=8",
    "pyyaml>=6,<7",
    "rotorpy>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real flight dynamics libraries on CPU"]
