[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-onboard-planner"
version = "0.1.0"
description = "Onboard software for autonomous UAV mission planning, execution, and in-flight replanning."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
basic = []
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
