time_step: 0.01
duration: 6.0
sample_interval: 0.2
seed: 42
show_animation: false
drones:
  - name: survey
    backend: rotorpy
    model: hummingbird
    position: [0.0, 0.0, 10.0]
    speed: 2.0
    heading: 0.0
    arrival_radius: 0.5
    waypoints:
      - [10.0, 0.0, 10.0]
  - name: traffic
    backend: jsbsim
    model: c172x
    position: [-200.0, 0.0, 300.0]
    speed: 50.0
    heading: 0.0
    arrival_radius: 40.0
    waypoints:
      - [-200.0, 1000.0, 300.0]
route_changes:
  - time: 1.0
    drone: survey
    arrival_radius: 0.5
    waypoints:
      - [10.0, 10.0, 10.0]
mission_cancellations:
  - time: 2.505
    drone: survey
