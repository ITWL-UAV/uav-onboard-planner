schema_version: 1

SYSTEM:
  source: profile
  fields:
    purpose: Serve as a civilian platform for aerial inspection of building exteriors.

GENERAL_INSTRUCTION:
  source: profile
  fields:
    objective: Survey the designated area to understand its surroundings and document the visible condition of building exteriors.
    sites: [designated area]
    constraints: []

USER_INSTRUCTION:
  source: operator
  fields:
    objective: What specific exterior inspection task or outcome did the operator request for this mission?
    sites: Which distinct sites did the operator explicitly name, in the requested order?
    constraints: What constraints did the operator explicitly specify, including any numbers and units?
  required:
    objective: true
    sites: true
    constraints: false

USER_PROMPT:
  source: operator
  fields:
    change: What adjustment to the active inspection did the operator request?
    sites: What is the complete ordered list of distinct sites after applying the edit to the latest accepted list?
    constraints: What changes to the constraints did the operator explicitly request, including any numbers and units?
  required:
    change: true
    sites: true
    constraints: false
