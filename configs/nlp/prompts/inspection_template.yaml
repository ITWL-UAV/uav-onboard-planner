schema_version: 1

SYSTEM:
  source: profile
  default_text: Serve as a civilian platform for aerial inspection of building exteriors.

GENERAL_INSTRUCTION:
  source: profile
  default_text: &general_objective >-
    Survey the designated area to understand its surroundings and document
    the visible condition of building exteriors.
  default_fields:
    objective: *general_objective
    sites: [designated area]
    constraints: []

USER_INSTRUCTION:
  source: operator
  default_text: null
  fields:
    objective:
      question: What specific exterior inspection task or outcome did the operator request for this mission?
      type: text
      required: true
      embed: true
    sites:
      question: Which distinct sites did the operator explicitly name, in the requested order?
      type: text_list
      required: true
      embed: true
    constraints:
      question: What constraints did the operator explicitly specify, including any numbers and units?
      type: text_list
      required: false
      embed: true

USER_PROMPT:
  source: operator
  default_text: null
  fields:
    change:
      question: What adjustment to the active inspection did the operator request?
      type: text
      required: true
      embed: true
    sites:
      question: What is the complete ordered list of distinct sites after applying the edit to the latest accepted list?
      type: text_list
      required: true
      embed: true
    constraints:
      question: What changes to the constraints did the operator explicitly request, including any numbers and units?
      type: text_list
      required: false
      embed: true
